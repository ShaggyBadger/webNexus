<!-- Location Detail Partial -->
<template x-if="selectedStore">
    <div class="card card-tactical mb-4" style="background-color: #1c1f23; border: 1px solid #ffb86c;">
        <div class="card-header card-tactical-header d-flex justify-content-between align-items-center">
            <span class="font-family-monospace text-uppercase text-tactical-warning font-weight-bold">
                <i class="fa-solid fa-building me-2"></i>LOCATION INTEL SUMMARY // STORE #<span x-text="selectedStore"></span>
            </span>
            <button
                type="button"
                class="btn btn-sm btn-tactical-secondary font-family-monospace py-0 px-2"
                @click="clearLocationDetail()"
            >
                <i class="fa-solid fa-xmark me-1"></i>CLOSE LOCATION
            </button>
        </div>
        <div class="card-body p-3">

            <template x-if="loadingDetail">
                <div class="text-center py-4">
                    <i class="fa-solid fa-spinner fa-spin fa-2x text-tactical-warning mb-2"></i>
                    <p class="font-family-monospace text-white small mb-0">FETCHING LOCATION DOCUMENTS & TANK CHART STATUS...</p>
                </div>
            </template>

            <template x-if="!loadingDetail && locationDetail">
                <div>
                    <!-- Header Info -->
                    <div class="p-3 mb-3 border border-secondary rounded" style="background-color: #121417;">
                        <h4 class="font-family-monospace text-white font-weight-bold mb-1" x-text="locationDetail.location.store_name"></h4>
                        <div class="font-family-monospace text-muted-custom small">
                            <span x-text="locationDetail.location.address"></span> &bull;
                            <span x-text="locationDetail.location.city"></span>,
                            <span x-text="locationDetail.location.state"></span>
                        </div>
                    </div>

                    <!-- Category Groups -->
                    <div class="row g-3">
                        <template x-for="(catData, catName) in locationDetail.documents" :key="catName">
                            <div class="col-12">
                                <div class="p-3 border border-secondary rounded" style="background-color: #121417;">
                                    <div class="font-family-monospace text-uppercase text-white font-weight-bold mb-2 pb-2 border-bottom border-secondary d-flex justify-content-between align-items-center">
                                        <span>
                                            <i class="fa-solid fa-folder me-2 text-tactical-warning"></i><span x-text="catName"></span>
                                        </span>
                                    </div>

                                    <!-- Tank Chart Section Handling -->
                                    <template x-if="catName === 'Tank Chart'">
                                        <div>
                                            <div class="d-flex flex-wrap align-items-center justify-content-between mb-3 gap-2">
                                                <div>
                                                    <span class="font-family-monospace small text-muted-custom me-2">CACHE STATE:</span>
                                                    <span
                                                        class="badge font-family-monospace me-2"
                                                        :class="catData.chart_status.cache_state === 'fresh' ? 'bg-success' : (catData.chart_status.cache_state === 'stale' ? 'bg-warning text-dark' : 'bg-danger')"
                                                        x-text="catData.chart_status.cache_state.toUpperCase()"
                                                    ></span>
                                                    <span class="font-family-monospace small text-muted-custom me-2">STATUS:</span>
                                                    <span class="badge bg-secondary font-family-monospace" x-text="catData.chart_status.generation_status.toUpperCase()"></span>
                                                </div>

                                                <div class="d-flex gap-2">
                                                    <template x-if="catData.download_url">
                                                        <a
                                                            :href="catData.download_url"
                                                            class="btn btn-sm btn-tactical-primary font-family-monospace py-1 px-3"
                                                            target="_blank"
                                                        >
                                                            <i class="fa-solid fa-file-pdf me-1"></i>DOWNLOAD CHART PDF
                                                        </a>
                                                    </template>
                                                    <template x-if="!catData.download_url">
                                                        <a
                                                            :href="'/tankcharts/store/' + selectedStore + '/download/'"
                                                            class="btn btn-sm btn-tactical-amber font-family-monospace py-1 px-3"
                                                            target="_blank"
                                                        >
                                                            <i class="fa-solid fa-arrows-rotate me-1"></i>GENERATE CHART PDF
                                                        </a>
                                                    </template>
                                                </div>
                                            </div>

                                            <!-- Tank Profiles Readout -->
                                            <template x-if="catData.tanks && catData.tanks.length > 0">
                                                <div class="mt-2 pt-2 border-top border-secondary">
                                                    <div class="font-family-monospace text-muted-custom small text-uppercase mb-2">CONFIGURED STORE TANKS:</div>
                                                    <div class="d-flex flex-wrap gap-2">
                                                        <template x-for="tk in catData.tanks" :key="tk.tank_index">
                                                            <span class="badge bg-dark border border-secondary text-white font-family-monospace py-1 px-2">
                                                                TANK <span x-text="tk.tank_index"></span>: <span x-text="tk.fuel_type"></span>
                                                            </span>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <!-- Standard Category Documents -->
                                    <template x-if="catName !== 'Tank Chart'">
                                        <div>
                                            <div class="list-group rounded-0">
                                                <template x-for="doc in catData.documents" :key="doc.id">
                                                    <a
                                                        :href="doc.download_url"
                                                        class="list-group-item list-group-item-action d-flex justify-content-between align-items-center text-white border-secondary py-2"
                                                        style="background-color: #121417;"
                                                        target="_blank"
                                                    >
                                                        <span class="font-family-monospace" x-text="doc.title"></span>
                                                        <span class="btn btn-sm btn-tactical-secondary font-family-monospace py-0 px-2">
                                                            <i class="fa-solid fa-download me-1"></i>DOWNLOAD
                                                        </span>
                                                    </a>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>

                </div>
            </template>
        </div>
    </div>
</template>
