<!-- Location Document Hub Search Panel Partial -->
<div class="card card-tactical mb-4" style="background-color: #1c1f23; border: 1px solid #2a2e33;">
    <div class="card-body p-3">

        <!-- Suggestion Strip -->
        {% if suggested_keywords %}
            <div class="mb-3 d-flex align-items-center flex-wrap gap-2">
                <span class="font-family-monospace text-uppercase small text-muted-custom me-2 font-weight-bold">
                    <i class="fa-solid fa-bolt text-tactical-warning me-1"></i>KEYWORDS YOU MIGHT LIKE:
                </span>
                {% for kw in suggested_keywords %}
                    <button
                        type="button"
                        class="btn btn-sm btn-tactical-secondary font-family-monospace text-uppercase py-1 px-2"
                        style="height: auto; min-height: 36px;"
                        @click="setSearchKeyword('{{ kw|escapejs }}')"
                    >
                        {{ kw }}
                    </button>
                {% endfor %}
            </div>
        {% endif %}

        <!-- Search Input Bar -->
        <div class="position-relative">
            <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-tactical-warning font-family-monospace">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input
                    type="text"
                    class="form-control bg-dark text-white border-secondary font-family-monospace py-2"
                    placeholder="SEARCH STORE #, CITY, STATE, TAG, OR DOCUMENT TITLE..."
                    x-model="hubQuery"
                    @input="onHubInput()"
                    style="min-height: 44px; outline-color: #ffb86c;"
                >
                <button
                    type="button"
                    class="btn btn-tactical-primary font-family-monospace px-3"
                    @click="runHubSearch()"
                    :disabled="loadingSearch"
                >
                    <template x-if="!loadingSearch">
                        <span>SEARCH</span>
                    </template>
                    <template x-if="loadingSearch">
                        <span><i class="fa-solid fa-spinner fa-spin me-1"></i>...</span>
                    </template>
                </button>
            </div>
        </div>

        <!-- Search Error Readout -->
        <template x-if="hubError">
            <div class="alert alert-danger font-family-monospace py-2 px-3 mt-3 mb-0 rounded-0" role="alert">
                <i class="fa-solid fa-triangle-exclamation me-2"></i><span x-text="hubError"></span>
            </div>
        </template>

        <!-- Search Results Panel -->
        <template x-if="hubResults">
            <div class="mt-3 pt-3 border-top border-secondary">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="font-family-monospace small text-uppercase text-tactical-warning font-weight-bold">
                        RESULTS FOR "<span x-text="hubResults.query"></span>" (<span x-text="hubResults.count"></span> FOUND)
                    </span>
                    <button
                        type="button"
                        class="btn btn-sm btn-tactical-secondary font-family-monospace py-1 px-2"
                        @click="hubResults = null; hubQuery = ''"
                    >
                        CLEAR SEARCH
                    </button>
                </div>

                <!-- Locations Result List -->
                <template x-if="hubResults.stores && hubResults.stores.length > 0">
                    <div class="mb-3">
                        <div class="font-family-monospace text-muted-custom small text-uppercase mb-2 font-weight-bold">
                            <i class="fa-solid fa-location-dot me-1"></i>LOCATIONS
                        </div>
                        <div class="row g-2">
                            <template x-for="st in hubResults.stores" :key="st.store_num">
                                <div class="col-md-6 col-lg-4">
                                    <div
                                        class="p-2 border rounded cursor-pointer d-flex justify-content-between align-items-center"
                                        style="background-color: #121417; border-color: #2a2e33 !important;"
                                        :class="selectedStore === st.store_num ? 'border-tactical-warning' : ''"
                                        @click="selectLocation(st.store_num)"
                                    >
                                        <div>
                                            <div class="font-family-monospace text-white font-weight-bold">
                                                STORE #<span x-text="st.store_num"></span>
                                            </div>
                                            <div class="small text-muted-custom font-family-monospace">
                                                <span x-text="st.store_name"></span> &bull; <span x-text="st.city"></span>, <span x-text="st.state"></span>
                                            </div>
                                        </div>
                                        <div class="text-end">
                                            <span class="badge bg-secondary font-family-monospace" x-text="st.document_count + ' DOCS'"></span>
                                            <div class="mt-1">
                                                <button type="button" class="btn btn-sm btn-tactical-amber font-family-monospace py-0 px-2 small">
                                                    SELECT &rarr;
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- Documents Result List -->
                <template x-if="hubResults.documents && hubResults.documents.length > 0">
                    <div>
                        <div class="font-family-monospace text-muted-custom small text-uppercase mb-2 font-weight-bold">
                            <i class="fa-solid fa-file-lines me-1"></i>DOCUMENTS
                        </div>
                        <div class="list-group rounded-0">
                            <template x-for="doc in hubResults.documents" :key="doc.id">
                                <a
                                    :href="doc.download_url"
                                    class="list-group-item list-group-item-action d-flex justify-content-between align-items-center text-white border-secondary py-2"
                                    style="background-color: #121417;"
                                    target="_blank"
                                >
                                    <div>
                                        <span class="font-family-monospace font-weight-bold" x-text="doc.title"></span>
                                        <span class="badge bg-dark border border-secondary text-muted-custom ms-2 font-family-monospace" x-text="doc.category"></span>
                                        <template x-if="doc.store_num">
                                            <span class="badge bg-dark border border-secondary text-tactical-warning ms-1 font-family-monospace" x-text="'STORE #' + doc.store_num"></span>
                                        </template>
                                    </div>
                                    <span class="btn btn-sm btn-tactical-secondary font-family-monospace py-0 px-2">
                                        <i class="fa-solid fa-download me-1"></i>DOWNLOAD
                                    </span>
                                </a>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </template>

    </div>
</div>
