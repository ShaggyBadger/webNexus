<div id="tactical-location-block">
    <div id="loc-ref-display" class="timestamp mono text-muted-custom">
        LOC_REF: FIELD_OPS
    </div>

    <div id="loc-intel-display" class="timestamp mono text-muted-custom location-intel-display">
    </div>

    <div x-show="storeNum !== null" class="mt-1 d-flex flex-wrap gap-2" x-cloak>
        <span
            class="mono fw-bold small vapor-manifold-tag"
            :class="vaporManifoldCssClass"
            x-text="vaporManifoldLabel"
        ></span>
        <span
            class="mono fw-bold small veeder-reading-tag"
            :class="veederReadingsCssClass"
            x-text="veederReadingsLabel"
        ></span>
    </div>
</div>
